# Builds Vectrex_EMU for Windows (x64), macOS (universal2: Intel + Apple Silicon) and Linux (x86-64), checks
# that each one starts (Mac and Linux: a snapshot of the OpenGL picture, Mine Storm), and publishes the three
# zips as the release named in VERSION. Each zip, the same on every system: the program, and next to it
# system (bios.bin), roms and overlays (Mine Storm (built in).art) folders, each with a note on what goes
# there (package/).
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: python.org Python 3.12 (universal2, with Tk)
        run: |
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          $PY -m venv venv
          venv/bin/python -m pip install -q --upgrade pip
          venv/bin/python -m pip install -q pyinstaller pyobjc-framework-Cocoa pysdl2 pysdl2-dll
          venv/bin/python -c "import tkinter, sdl2; print('Tk', tkinter.TkVersion)"
      - name: build
        run: PY=venv/bin/python sh build_mac.sh
      - name: check the binaries are universal
        run: |
          lipo -info core/vectrex_core
          lipo -info dist-mac/Vectrex_EMU.app/Contents/MacOS/Vectrex_EMU
          find dist-mac/Vectrex_EMU.app -name 'libSDL2*' -exec lipo -info {} \;
      - name: Finder aliases in the roms folder
        run: venv/bin/python tools/alias_test.py
      - name: the BIOS and the overlay next to the app (tests only; the zips carry them)
        run: |
          mkdir -p dist-mac/system dist-mac/overlays
          cp system/bios.bin dist-mac/system/
          cp overlays/*.art dist-mac/overlays/
      - name: snapshot from the sources
        run: |
          venv/bin/python tools/snapshot_test.py mac-source.png 5 --scale 0.4 > mac-source.log 2>&1 &
          sleep 7
          screencapture -x mac-screen.png || true
          wait $! ; echo "exit $?" >> mac-source.log
          cat mac-source.log
      - name: run the app
        run: |
          dist-mac/Vectrex_EMU.app/Contents/MacOS/Vectrex_EMU --demo 9 --scale 0.4 > mac-app.log 2>&1 &
          sleep 7
          screencapture -x mac-app-screen.png || true
          wait $! ; echo "exit $?" >> mac-app.log
          cat mac-app.log
      - name: pack the app
        run: |
          mkdir -p pkg                                                      # (the app, system, roms, overlays)
          ditto dist-mac/Vectrex_EMU.app pkg/Vectrex_EMU.app
          ditto system pkg/system
          ditto overlays pkg/overlays
          ditto package pkg
          ditto -c -k --sequesterRsrc pkg Vectrex_EMU-mac-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            Vectrex_EMU-mac-app.zip
            mac-*.png
            mac-*.log
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-22.04          # (an older glibc: runs on most distributions)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 x11-utils
          python -m pip install -q pyinstaller pysdl2 pysdl2-dll
          python -c "import tkinter, sdl2; print('Tk', tkinter.TkVersion)"
      - name: build
        run: PY=python sh build_linux.sh
      - name: the BIOS and the overlay next to the program (tests only; the zips carry them)
        run: |
          mkdir -p dist-linux/system dist-linux/overlays
          cp system/bios.bin dist-linux/system/
          cp overlays/*.art dist-linux/overlays/
      - name: snapshot from the sources
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python tools/snapshot_test.py linux-source.png 5 2>&1 | tee linux-source.log
      - name: run the program
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" dist-linux/Vectrex_EMU --demo 6 > linux-app.log 2>&1; echo "exit $?" >> linux-app.log
          cat linux-app.log
      - name: pack the program
        run: |
          rm -f dist-linux/Vectrex_EMU.conf dist-linux/system/settings.json
          cp -r package/. dist-linux/
          cd dist-linux && zip -q -r ../Vectrex_EMU-linux-bin.zip Vectrex_EMU system roms overlays uvmc2   # (the program, system, roms, overlays, the UVMC2 card)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Vectrex_EMU-linux-bin.zip
            linux-*.png
            linux-*.log
          if-no-files-found: warn

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyInstaller
        run: python -m pip install -q pyinstaller
      - name: build (the core with Visual C++, then the exe)
        shell: cmd
        run: |
          call build_core.bat || exit /b 1
          call build_exe.bat || exit /b 1
      - name: does it start
        shell: pwsh
        run: |
          $p = Start-Process .\build\Vectrex_EMU\Vectrex_EMU.exe -ArgumentList '--demo','8' -PassThru
          Start-Sleep 6
          if ($p.HasExited) { "exited early: $($p.ExitCode)" | Tee-Object win-app.log; exit 1 }
          "running after 6 s" | Tee-Object win-app.log
          Stop-Process -Id $p.Id -Force
      - name: pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item build/Vectrex_EMU/Vectrex_EMU.exe pkg/
          Copy-Item -Recurse system, overlays pkg/
          Copy-Item -Recurse -Force package/* pkg/
          Compress-Archive -Path pkg/* -DestinationPath Vectrex_EMU-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Vectrex_EMU-windows.zip
            win-*.log
          if-no-files-found: warn

  release:                         # the build replaces the release named in VERSION (marked Latest)
    needs: [mac, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
      - name: replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(head -n 1 repo/VERSION | tr -d ' \r')
          { awk -v v="## $VER" '$0 == v {on=1; next} on && /^## / {exit} on' repo/RELEASE_NOTES.md
            echo; echo "Built from ${GITHUB_SHA::7}."; } > notes.md
          gh release delete latest-build --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release delete "$VER" --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create "$VER" -R "$GITHUB_REPOSITORY" --latest --target "$GITHUB_SHA" \
            --title "$VER" --notes-file notes.md windows/*.zip mac/*.zip linux/*.zip   # (the checks' logs and pictures stay with the run)
