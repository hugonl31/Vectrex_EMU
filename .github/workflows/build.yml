# Builds Vectrex_EMU for macOS (universal2: Intel + Apple Silicon) and Linux (x86-64), and checks that
# each one opens its window and draws with OpenGL (a snapshot of the picture: Mine Storm). The Windows exe is built locally (build_core.bat, build_exe.bat).
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: python.org Python 3.12 (universal2, with Tk)
        run: |
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          $PY -m venv venv
          venv/bin/python -m pip install -q --upgrade pip
          venv/bin/python -m pip install -q pyinstaller pyobjc-framework-Cocoa pysdl2 pysdl2-dll
          venv/bin/python -c "import tkinter, sdl2; print('Tk', tkinter.TkVersion)"
      - name: build
        run: PY=venv/bin/python sh build_mac.sh
      - name: check the binaries are universal
        run: |
          lipo -info core/vectrex_core
          lipo -info dist-mac/Vectrex_EMU.app/Contents/MacOS/Vectrex_EMU
          find dist-mac/Vectrex_EMU.app -name 'libSDL2*' -exec lipo -info {} \;
      - name: the BIOS next to the app (tests only; the zips carry it)
        run: |
          mkdir -p dist-mac/bios
          cp bios/bios.bin dist-mac/bios/
      - name: snapshot from the sources
        run: |
          venv/bin/python tools/snapshot_test.py mac-source.png 5 --scale 0.4 > mac-source.log 2>&1 &
          sleep 7
          screencapture -x mac-screen.png || true
          wait $! ; echo "exit $?" >> mac-source.log
          cat mac-source.log
      - name: run the app
        run: |
          dist-mac/Vectrex_EMU.app/Contents/MacOS/Vectrex_EMU --demo 9 --scale 0.4 > mac-app.log 2>&1 &
          sleep 7
          screencapture -x mac-app-screen.png || true
          wait $! ; echo "exit $?" >> mac-app.log
          cat mac-app.log
      - name: pack the app
        run: |
          rm -f dist-mac/Vectrex_EMU.conf
          ditto -c -k --sequesterRsrc dist-mac Vectrex_EMU-mac-app.zip      # (the app and its bios folder)
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            Vectrex_EMU-mac-app.zip
            mac-*.png
            mac-*.log
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-22.04          # (an older glibc: runs on most distributions)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 x11-utils
          python -m pip install -q pyinstaller pysdl2 pysdl2-dll
          python -c "import tkinter, sdl2; print('Tk', tkinter.TkVersion)"
      - name: build
        run: PY=python sh build_linux.sh
      - name: the BIOS next to the program (tests only; the zips carry it)
        run: |
          mkdir -p dist-linux/bios
          cp bios/bios.bin dist-linux/bios/
      - name: snapshot from the sources
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python tools/snapshot_test.py linux-source.png 5 2>&1 | tee linux-source.log
      - name: run the program
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" dist-linux/Vectrex_EMU --demo 6 > linux-app.log 2>&1; echo "exit $?" >> linux-app.log
          cat linux-app.log
      - name: pack the program
        run: |
          rm -f dist-linux/Vectrex_EMU.conf
          cd dist-linux && zip -q -r ../Vectrex_EMU-linux-bin.zip Vectrex_EMU bios      # (the program and its bios folder)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Vectrex_EMU-linux-bin.zip
            linux-*.png
            linux-*.log
          if-no-files-found: warn

  release:                         # the build replaces the release named in VERSION (marked Latest)
    needs: [mac, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
      - name: replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(head -n 1 repo/VERSION | tr -d ' \r')
          { awk -v v="## $VER" '$0 == v {on=1; next} on && /^## / {exit} on' repo/RELEASE_NOTES.md
            echo; echo "Built from ${GITHUB_SHA::7}."; } > notes.md
          gh release delete latest-build --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release delete "$VER" --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create "$VER" -R "$GITHUB_REPOSITORY" --latest --target "$GITHUB_SHA" \
            --title "$VER" --notes-file notes.md mac/* linux/*
