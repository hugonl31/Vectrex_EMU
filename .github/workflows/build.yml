# Builds Vectrex_EMU for macOS (universal2: Intel + Apple Silicon) and Linux (x86-64), and checks that
# each one opens its window and draws with OpenGL (a snapshot of the picture; a stand-in BIOS: the real
# one is not in this repository). The Windows exe is built locally (build_core.bat, build_exe.bat).
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: python.org Python 3.12 (universal2, with Tk)
        run: |
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          $PY -m venv venv
          venv/bin/python -m pip install -q --upgrade pip
          venv/bin/python -m pip install -q pyinstaller pyobjc-framework-Cocoa pysdl2 pysdl2-dll
          venv/bin/python -c "import tkinter, sdl2; print('Tk', tkinter.TkVersion)"
      - name: build
        run: PY=venv/bin/python sh build_mac.sh
      - name: check the binaries are universal
        run: |
          lipo -info core/vectrex_core
          lipo -info dist-mac/Vectrex_EMU.app/Contents/MacOS/Vectrex_EMU
          find dist-mac/Vectrex_EMU.app -name 'libSDL2*' -exec lipo -info {} \;
      - name: stand-in BIOS (tests only)
        run: |
          mkdir -p bios dist-mac/bios
          python3 -c "open('bios/bios.bin','wb').write(bytes([0x12])*8190+bytes([0xF0,0x00]))"
          cp bios/bios.bin dist-mac/bios/
      - name: what the app holds (SDL)
        run: |
          find dist-mac/Vectrex_EMU.app -iname '*sdl*' > mac-bundle.log
          venv/bin/pyi-archive_viewer -l -r dist-mac/Vectrex_EMU.app/Contents/MacOS/Vectrex_EMU 2>&1 | grep -i sdl >> mac-bundle.log || true
          grep -ri "sdl2" build/pyi-mac/Vectrex_EMU/warn-Vectrex_EMU.txt >> mac-bundle.log || true
      - name: OpenGL over Tk, minimal (both display ways)
        run: |
          for m in child subview; do
            VX_MACGL=$m venv/bin/python tools/macgl_test.py 6 > mac-gltest-$m.log 2>&1 &
            sleep 4
            screencapture -x mac-gltest-$m.png || true
            wait
            cat mac-gltest-$m.log
          done
      - name: screenshot check with a plain Tk window (no OpenGL)
        run: |
          venv/bin/python -c "import tkinter as tk; r=tk.Tk(); r.geometry('400x300+100+100'); c=tk.Canvas(r,bg='black'); c.pack(fill='both',expand=1); c.create_rectangle(50,50,350,250,fill='red'); r.after(6000,r.destroy); r.mainloop()" &
          sleep 4
          screencapture -x mac-screen-tk.png || true
          wait
      - name: snapshots from the sources (both macOS display ways)
        run: |
          for m in child nearest rgba8; do
            VX_TEX=$( [ $m != child ] && echo $m ) VX_STAGES=1 VECTREX_HZ=4 VX_MACGL=child venv/bin/python tools/snapshot_test.py mac-source-$m.png 5 --scale 0.3 > mac-source-$m.log 2>&1 &
            sleep 6
            screencapture -x mac-screen-$m.png || true
            wait $! ; echo "exit $?" >> mac-source-$m.log
            cat mac-source-$m.log
          done
      - name: run the app
        run: |
          VECTREX_HZ=4 VX_DEBUG=1 dist-mac/Vectrex_EMU.app/Contents/MacOS/Vectrex_EMU --demo 9 --scale 0.3 > mac-app.log 2>&1 &
          sleep 6
          screencapture -x mac-app-screen.png || true
          wait $! ; echo "exit $?" >> mac-app.log
          cat mac-app.log
      - name: macOS 15 results under their own names
        if: matrix.os == 'macos-15'
        run: for f in mac-*.png mac-*.log; do mv "$f" "m15-$f"; done
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: mac15
          path: |
            m15-*.png
            m15-*.log
      - name: pack the app
        run: |
          rm -rf dist-mac/bios
          ditto -c -k --sequesterRsrc --keepParent dist-mac/Vectrex_EMU.app Vectrex_EMU-mac-app.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-14'
        with:
          name: mac
          path: |
            Vectrex_EMU-mac-app.zip
            mac-*.png
            mac-*.log
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-22.04          # (an older glibc: runs on most distributions)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 x11-utils
          python -m pip install -q pyinstaller pysdl2 pysdl2-dll
          python -c "import tkinter, sdl2; print('Tk', tkinter.TkVersion)"
      - name: build
        run: PY=python sh build_linux.sh
      - name: stand-in BIOS (tests only)
        run: |
          mkdir -p bios dist-linux/bios
          python -c "open('bios/bios.bin','wb').write(bytes([0x12])*8190+bytes([0xF0,0x00]))"
          cp bios/bios.bin dist-linux/bios/
      - name: snapshot from the sources
        run: VX_STAGES=1 xvfb-run -a -s "-screen 0 1600x1200x24" python tools/snapshot_test.py linux-source.png 5 2>&1 | tee linux-source.log
      - name: run the program
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" dist-linux/Vectrex_EMU --demo 6 > linux-app.log 2>&1; echo "exit $?" >> linux-app.log
          cat linux-app.log
      - name: pack the program
        run: |
          rm -rf dist-linux/bios
          cd dist-linux && zip -q ../Vectrex_EMU-linux-bin.zip Vectrex_EMU
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Vectrex_EMU-linux-bin.zip
            linux-*.png
            linux-*.log
          if-no-files-found: warn

  release:                         # the builds on the repository's "Latest build" release page
    needs: [mac, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest-build -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA"             --title "Latest build"             --notes "Built from ${GITHUB_SHA::7}. The Mac app (Intel + Apple Silicon) and the Linux program alone: put the Vectrex BIOS in a bios folder next to it (bios/bios.bin) and your ROMs in a roms folder. See README.md. The PNG and log files are the build's own checks."             mac/* mac15/* linux/*
