# RetroArch for iOS (iPhone / iPad) with the Vectrex_EMU core built in: RetroArch's own source (the version the
# Retroid Nova runs), the core as one of its frameworks (iOS loads no cores from outside the app), its info file in
# RetroArch's assets. Runs on the ios branch or by hand - not on main (that is build.yml: the releases).
# Out: the app signed and uploaded to App Store Connect (TestFlight) as Vectrex_EMU, com.hugob.vectrexemu - Apple's
# cloud signing with the App Store Connect API key (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) -
# and Vectrex_EMU_RetroArch_iOS.zip (system, roms, info, config - copied into RetroArch's folder with the Files app).
name: ios
on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: vx
      - name: RetroArch's source (v1.22.2)
        run: git clone -q --depth 1 --branch v1.22.2 https://github.com/libretro/RetroArch.git ra
      - name: the core for iOS (arm64, no JIT)
        run: |
          sh vx/libretro/build_libretro.sh ios
          cp vx/libretro/vectrex_emu_libretro_ios.dylib ra/pkg/apple/iOS/modules/
          lipo -info vx/libretro/vectrex_emu_libretro_ios.dylib
      - name: its info file in RetroArch's assets
        run: |
          mkdir -p add/info && cp vx/libretro/vectrex_emu_libretro.info add/info/
          (cd add && zip -q ../ra/pkg/apple/assets.zip info/vectrex_emu_libretro.info)
          unzip -l ra/pkg/apple/assets.zip | grep vectrex
      - name: RetroArch for iOS, signed and uploaded to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          VER=$(tr -d 'v\r\n ' < vx/VERSION)
          cd ra
          # (the home screen's name; RetroArch's own iCloud, Siri and app group entitlements left out - ours has none)
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Vectrex_EMU" pkg/apple/iOS/Info.plist
          # (archived unsigned; the export signs it all - app, widget, the core's framework - with Apple's cloud
          #  signing, so no certificate is kept here)
          xcodebuild archive -workspace pkg/apple/RetroArch.xcworkspace -destination generic/platform=iOS -config Release \
            -scheme "RetroArch iOS Release" -xcconfig pkg/apple/GitHubCI.xcconfig -archivePath "$RUNNER_TEMP/VX.xcarchive" \
            IOS_BUNDLE_IDENTIFIER=com.hugob.vectrexemu IOS_CODE_SIGN_ENTITLEMENTS= DEVELOPMENT_TEAM=$TEAM \
            MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -B8 -A3 -E 'error:|FAILED|failed with' "$RUNNER_TEMP/archive.log" | tail -120; exit 1; }
          # (RetroArch's make-frameworks.sh signs the cores itself: '-', ad hoc, needs no keychain - the export signs them again)
          grep -E 'ARCHIVE SUCCEEDED|Making framework' "$RUNNER_TEMP/archive.log"
          ls "$RUNNER_TEMP/VX.xcarchive/Products/Applications/"*/Frameworks | grep -i vectrex
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VX.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH 2>&1 | tail -40
          rm -f "$KEY"
      - name: the core's files for RetroArch's folder
        run: python3 vx/libretro/package_retroarch.py ios-arm64 vx/libretro/vectrex_emu_libretro_ios.dylib Vectrex_EMU_RetroArch_iOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            Vectrex_EMU_RetroArch_iOS.zip
