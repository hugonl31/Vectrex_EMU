# Vectrex_EMU for iPhone and iPad - our own app around the core (ios/; the plan and its screens: the mockup canvas).
# The RetroArch-based test app this replaces is kept on the branch ios-retroarch. Runs on the ios branch or by hand.
# The app is code only: the private test builds fetch their games, overlays, BIOS, UVMC2 and PiTrex once from the
# project's server (tools/ios_pack.py) and send their logs there live - both with the IOS_LOG_TOKEN secret.
# Out: the app signed with Apple's cloud signing (the App Store Connect API key: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# APPLE_TEAM_ID) and uploaded to TestFlight as Vectrex_EMU, com.hugob.vectrexemu; the symbols kept with the run.
name: ios
on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15-intel   # (2026-11-18: GitHub's Apple Silicon macOS runners were often busy; the Intel ones started
                              #  at once, Xcode 26 on them too; the app is built for iOS arm64 either way)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: vx
      - name: Xcode 26 (App Store Connect takes only apps built with the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          test -n "$X" || { echo "no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: the Xcode project (XcodeGen), the icon, the test build's token
        env:
          VX_LOG_TOKEN: ${{ secrets.IOS_LOG_TOKEN }}
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          [ -n "$VX_LOG_TOKEN" ] && printf '#define VX_LOG_TOKEN "%s"\n' "$VX_LOG_TOKEN" > vx/ios/App/vx_token.h
          cp vx/icons/ios_icon_1024.png vx/ios/Assets.xcassets/AppIcon.appiconset/icon_1024.png
          cd vx/ios && xcodegen generate
      - name: Vectrex_EMU for iOS, signed and uploaded to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          VER=$(tr -d 'v\r\n ' < vx/VERSION)
          cd vx/ios
          # (archived unsigned; the export signs it with Apple's cloud signing, so no certificate is kept here)
          xcodebuild archive -project VectrexEMU.xcodeproj -scheme VectrexEMU -destination generic/platform=iOS -configuration Release \
            -archivePath "$RUNNER_TEMP/VX.xcarchive" DEVELOPMENT_TEAM=$TEAM MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -B4 -A3 -E 'error:|FAILED|failed with' "$RUNNER_TEMP/archive.log" | tail -150; exit 1; }
          grep -E 'ARCHIVE SUCCEEDED' "$RUNNER_TEMP/archive.log"
          grep -c 'warning:' "$RUNNER_TEMP/archive.log" || true
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VX.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH 2>&1 | tail -40
          rm -f "$KEY"
          # (the symbols, for a crash report: the dSYM and the app's binary - kept with the run)
          mkdir -p "$GITHUB_WORKSPACE/symbols"; cp -R "$RUNNER_TEMP/VX.xcarchive/dSYMs" "$GITHUB_WORKSPACE/symbols/" 2>/dev/null || true
          A=$(ls -d "$RUNNER_TEMP/VX.xcarchive/Products/Applications/"*.app); cp "$A/Vectrex_EMU" "$GITHUB_WORKSPACE/symbols/"; du -sh "$A"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-symbols
          path: symbols
