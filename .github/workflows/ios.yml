# RetroArch for iOS (iPhone / iPad) with the Vectrex_EMU core built in: RetroArch's own source (the version the
# Retroid Nova runs), the core as one of its frameworks (iOS loads no cores from outside the app), its info file in
# RetroArch's assets. Runs on the ios branch or by hand - not on main (that is build.yml: the releases).
# Out: the app signed and uploaded to App Store Connect (TestFlight) as Vectrex_EMU, com.hugob.vectrexemu - Apple's
# cloud signing with the App Store Connect API key (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) -
# and Vectrex_EMU_RetroArch_iOS.zip (system, roms, info, config - copied into RetroArch's folder with the Files app).
name: ios
on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15-intel   # (2026-11-18: GitHub's Apple Silicon macOS runners were often busy - jobs not started at all;
                              #  the Intel ones started at once, Xcode 26 on them too; the app is built for iOS arm64 either way)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: vx
      - name: Xcode 26 (App Store Connect takes only apps built with the iOS 26 SDK or later)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          test -n "$X" || { echo "no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
          # (RetroArch's Metal shaders: Xcode 26 has its Metal compiler as a separate download - the Intel image lacks it)
          xcrun -f metal >/dev/null 2>&1 && xcrun metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: RetroArch's source (v1.22.2)
        run: git clone -q --depth 1 --branch v1.22.2 https://github.com/libretro/RetroArch.git ra
      - name: the core for iOS (arm64, no JIT)
        run: |
          sh vx/libretro/build_libretro.sh ios
          cp vx/libretro/vectrex_emu_libretro_ios.dylib ra/pkg/apple/iOS/modules/
          lipo -info vx/libretro/vectrex_emu_libretro_ios.dylib
      - name: everything ready to play in RetroArch's assets (unpacked into its folder after each install or update)
        run: |
          python3 vx/libretro/ios_bundle.py vx/libretro/vectrex_emu_libretro_ios.dylib add
          # (RetroArch's menu icons, all of them: its source's assets.zip has only some - the iPad's Ozone menu drew the
          #  rest as white blocks. From retroarch-assets, as its App Store build does; the Vectrex_EMU playlist gets
          #  RetroArch's own Vectrex icons)
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/libretro/retroarch-assets.git rassets
          (cd rassets && git sparse-checkout set glui ozone rgui)
          mkdir -p add/assets && cp -R rassets/glui rassets/ozone rassets/rgui add/assets/
          I=add/assets/ozone/png/icons; cp "$I/GCE - Vectrex.png" "$I/Vectrex_EMU.png"; cp "$I/GCE - Vectrex-content.png" "$I/Vectrex_EMU-content.png"
          ls "$I" | wc -l; ls "$I" | grep -i vectrex
          # (the on-screen gamepad the core's settings switch on: RetroArch's neo-retropad)
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/libretro/common-overlays.git co
          (cd co && git sparse-checkout set gamepads/neo-retropad)
          mkdir -p add/overlays/gamepads && cp -R co/gamepads/neo-retropad add/overlays/gamepads/
          ls add/overlays/gamepads/neo-retropad/neo-retropad.cfg; cat add/config/Vectrex_EMU/Vectrex_EMU.cfg
          (cd add && zip -qr ../ra/pkg/apple/assets.zip .)
          unzip -l ra/pkg/apple/assets.zip | grep -c -i -E 'roms/|vectrex_emu' ; du -sh add ra/pkg/apple/assets.zip
          # (RetroArch's own source: its assets unpacked after every update; the on-screen gamepad hidden while a
          #  keyboard is connected too - ios_patch_ra.py)
          python3 vx/libretro/ios_patch_ra.py ra
          # (the app's icon: ours, not RetroArch's - one 1024 x 1024 picture, iOS makes the other sizes)
          cp vx/icons/ios_icon_1024.png "ra/pkg/apple/iOS/Resources/Icons.xcassets/Default.appiconset/Icon-83.5-3.png"
      - name: RetroArch for iOS, signed and uploaded to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          VER=$(tr -d 'v\r\n ' < vx/VERSION)
          cd ra
          # (the home screen's name; RetroArch's own iCloud, Siri and app group entitlements left out - ours has none)
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Vectrex_EMU" pkg/apple/iOS/Info.plist
          # (archived unsigned; the export signs it all - app, widget, the core's framework - with Apple's cloud
          #  signing, so no certificate is kept here)
          xcodebuild archive -workspace pkg/apple/RetroArch.xcworkspace -destination generic/platform=iOS -config Release \
            -scheme "RetroArch iOS Release" -xcconfig pkg/apple/GitHubCI.xcconfig -archivePath "$RUNNER_TEMP/VX.xcarchive" \
            IOS_BUNDLE_IDENTIFIER=com.hugob.vectrexemu IOS_CODE_SIGN_ENTITLEMENTS= DEVELOPMENT_TEAM=$TEAM \
            MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER RA_IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -B8 -A3 -E 'error:|FAILED|failed with' "$RUNNER_TEMP/archive.log" | tail -120; exit 1; }
          # (RetroArch's make-frameworks.sh signs the cores itself: '-', ad hoc, needs no keychain - the export signs them again)
          grep -E 'ARCHIVE SUCCEEDED|Making framework' "$RUNNER_TEMP/archive.log"
          ls "$RUNNER_TEMP/VX.xcarchive/Products/Applications/"*/Frameworks | grep -i vectrex
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VX.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH 2>&1 | tail -40
          rm -f "$KEY"
      - name: the core's files for RetroArch's folder
        run: python3 vx/libretro/package_retroarch.py ios-arm64 vx/libretro/vectrex_emu_libretro_ios.dylib Vectrex_EMU_RetroArch_iOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            Vectrex_EMU_RetroArch_iOS.zip
